{% extends "base.html" %}
{% from '_nav_icons.html' import menu_icon %}
{% block title %}ホーム｜救援物資配送支援システム{% endblock %}
{% block content %}
<div class="home-page home-dashboard">
    <section class="hero-panel home-banner" aria-label="救援物資配送支援システムの紹介">
        <img class="home-hero-image" src="{{ url_for('static', filename='home_hero.webp') }}" alt="救援物資配送支援システム：支援物資をトラックで避難所へ配送するイメージ" />
        <h1 class="screen-reader-only">救援物資配送支援システム</h1>
    </section>

    <nav class="home-menu-grid home-menu-grid-four" aria-label="ホームの機能メニュー">
        <a class="home-menu-card blue" href="{{ url_for('allocation') }}">
            {{ menu_icon('allocation') }}<span class="home-card-title">配分計画</span><span class="home-card-arrow" aria-hidden="true">›</span>
        </a>
        <a class="home-menu-card green" href="{{ url_for('plan') }}">
            {{ menu_icon('plan') }}<span class="home-card-title">配送計画</span><span class="home-card-arrow" aria-hidden="true">›</span>
        </a>
        <a class="home-menu-card orange" href="{{ url_for('routes_page') }}">
            {{ menu_icon('routes') }}<span class="home-card-title">物資輸送経路</span><span class="home-card-arrow" aria-hidden="true">›</span>
        </a>
        <a class="home-menu-card purple" href="{{ url_for('results_page') }}">
            {{ menu_icon('results') }}<span class="home-card-title">結果の表示</span><span class="home-card-arrow" aria-hidden="true">›</span>
        </a>
    </nav>
</div>
{% endblock %}
